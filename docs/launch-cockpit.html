<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style id="s">
/* Layout: one reading column — progress header, screen strip, phased checklist, copy-ready store texts */
:root{
  --bg:#fffaf8; --surface:#ffffff; --sunk:#f6eeea; --line:#ecdcd5; --fg:#22171a; --muted:#76646a;
  --accent:#e8385c; --accent-2:#ff8a3d; --ok:#178a4c; --ok-bg:#e3f5ea; --code-bg:#2a1f22; --code-fg:#ffe9e1;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161013; --surface:#20171b; --sunk:#2a1f24; --line:#3a2c31; --fg:#f7ebee; --muted:#b39fa5;
  --accent:#ff5c7c; --accent-2:#ff9a55; --ok:#4fd28a; --ok-bg:#173326; --code-bg:#0f0a0c; --code-fg:#ffe9e1; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161013; --surface:#20171b; --sunk:#2a1f24; --line:#3a2c31; --fg:#f7ebee; --muted:#b39fa5;
  --accent:#ff5c7c; --accent-2:#ff9a55; --ok:#4fd28a; --ok-bg:#173326; --code-bg:#0f0a0c; --code-fg:#ffe9e1; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:40px 80px;display:flex;flex-direction:column;gap:48px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:clamp(34px,7vw,56px);font-weight:800;letter-spacing:-.02em}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:26px;font-weight:800}
h3{font-size:18px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
header{display:flex;flex-direction:column;gap:14px}
.lede{max-width:62ch;font-size:18px;color:var(--muted)}
.meter{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.meter-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.meter-top strong{font-family:var(--display);font-size:28px}
.bar{height:12px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .4s ease}
.save{font-size:13px;color:var(--muted);min-height:1.4em}
.strip{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory}
.strip figure{margin:0;flex:0 0 150px;scroll-snap-align:start;display:flex;flex-direction:column;gap:8px}
.strip img{width:150px;aspect-ratio:300/650;border-radius:18px;border:1px solid var(--line);display:block;object-fit:cover}
.strip figcaption{font-size:13px;font-weight:600;color:var(--muted)}
section{display:flex;flex-direction:column;gap:18px}
.phase{display:flex;flex-direction:column;gap:10px}
.phase-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:8px}
.phase-head span{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.item{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:12px 4px;border-radius:12px}
.item:hover{background:var(--sunk)}
.item input{appearance:none;width:24px;height:24px;margin:2px 0 0;border:2px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;display:grid;place-items:center;transition:background .15s,border-color .15s}
.item input:checked{background:var(--ok);border-color:var(--ok)}
.item input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.item input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.item input:disabled{cursor:default}
.item-body{min-width:0;display:flex;flex-direction:column;gap:6px}
.item label{font-weight:600;cursor:pointer}
.item.done label{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.who{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);margin-left:6px;vertical-align:2px}
.who.must{background:var(--accent);color:#fff}
.detail{font-size:15px;color:var(--muted);max-width:68ch}
.cmd{display:flex;align-items:stretch;border-radius:10px;background:var(--code-bg);color:var(--code-fg);overflow:hidden;max-width:100%}
.cmd code{flex:1;min-width:0;font-family:var(--mono);font-size:13px;padding:10px 12px;overflow-x:auto;white-space:pre}
.copy{font:600 13px var(--body);border:0;cursor:pointer;padding:0 14px;background:rgba(255,255,255,.08);color:var(--code-fg)}
.copy:hover{background:rgba(255,255,255,.16)}
.copy:focus-visible,.copy-text:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.done-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px 24px;padding:0;margin:0;list-style:none}
.done-list li{display:flex;gap:10px;font-size:15px}
.done-list li::before{content:"✓";color:var(--ok);font-weight:800}
.texts{display:flex;flex-direction:column;gap:14px}
.text-card{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.text-card .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.text-card pre{margin:0;font-family:var(--body);font-size:15px;white-space:pre-wrap;word-break:break-word}
.copy-text{font:600 13px var(--body);border:1px solid var(--line);background:var(--sunk);color:var(--fg);padding:6px 12px;border-radius:99px;cursor:pointer}
.note{border-left:3px solid var(--accent);padding:4px 0 4px 14px;color:var(--muted);font-size:15px;max-width:68ch}
@media (prefers-reduced-motion: reduce){.bar>i{transition:none}}
</style>

<script id="main">
(() => {
const RESET = ':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
const state = JSON.parse(document.getElementById('state').textContent || '{"done":{}}');
state.done = state.done || {};
const imgs = JSON.parse(document.getElementById('imgs').textContent || '[]');

const PHASES = [
  { id: 'accounts', title: 'Konten anlegen', items: [
    { id: 'github', t: 'GitHub verbinden und leeres Repository anlegen', who: 'du', must: true, d: 'Unter claude.ai/connect-github dein Konto verbinden, ein leeres privates Repository (z. B. funke-app) anlegen und es in einer neuen Claude-Session auswählen. Dann lade ich den Code hoch.' },
    { id: 'apple', t: 'Apple Developer Program beitreten', who: 'du', must: true, d: '99 $ pro Jahr, Freischaltung dauert 1–2 Tage. Als Firma brauchst du eine D-U-N-S-Nummer.' },
    { id: 'google', t: 'Google Play Console registrieren', who: 'du', must: true, d: '25 $ einmalig. Neue private Konten müssen vor dem Launch 14 Tage mit 12 Testern testen.' },
    { id: 'expo', t: 'Expo-Konto erstellen und Projekt verknüpfen', who: 'du', d: 'Danach steht die projectId in app.json, die Push-Benachrichtigungen brauchen.', cmd: 'npx eas-cli@latest login && npx eas-cli@latest init' },
    { id: 'supabase', t: 'Supabase-Projekt in der Region Frankfurt anlegen', who: 'du', must: true, d: 'EU-Region wegen DSGVO. Für den Start reicht der Pro-Plan (25 $/Monat).' },
  ]},
  { id: 'backend', title: 'Backend einrichten', items: [
    { id: 'schema', t: 'Datenbank-Schema einspielen', who: 'du', must: true, d: 'Zwei Migrationen: Tabellen, Zugriffsregeln, Match-Logik, Fotospeicher, Spam-Schutz und Moderation. 19 automatische Sicherheitsprüfungen bestanden.', cmd: 'supabase link --project-ref DEIN_REF && supabase db push' },
    { id: 'env', t: 'Zugangsdaten in .env eintragen', who: 'du', must: true, d: 'Ohne diese Datei läuft die App im Demo-Modus.', cmd: 'cp .env.example .env' },
    { id: 'smtp', t: 'Mail-Versand für Login-Codes einrichten', who: 'du', must: true, d: 'In Supabase unter Auth → SMTP einen Anbieter wie Resend oder Postmark eintragen. In der Mailvorlage {{ .Token }} verwenden.' },
    { id: 'login-phone', t: 'SMS-Login einrichten', who: 'du', must: true, d: 'Supabase → Auth → Providers → Phone aktivieren und einen SMS-Anbieter wie Twilio eintragen. Kostet ca. 5–10 Cent pro SMS.' },
    { id: 'login-google', t: 'Google-Login einrichten', who: 'du', must: true, d: 'Google Cloud Console: OAuth-Client-IDs für Web, iOS und Android anlegen. Web-ID in Supabase eintragen, alle IDs in .env, iOS-URL-Schema in app.json.' },
    { id: 'login-apple', t: 'Apple-Login einrichten', who: 'du', must: true, d: 'Pflicht, sobald Google-Login angeboten wird. In der App-ID „Sign in with Apple“ aktivieren und in Supabase den Apple-Provider mit .p8-Schlüssel eintragen.' },
    { id: 'push', t: 'Push-Funktion deployen und Webhooks anlegen', who: 'du', d: 'Zwei Webhooks: INSERT auf messages und matches, mit Header x-webhook-secret.', cmd: 'supabase functions deploy push --no-verify-jwt && supabase secrets set WEBHOOK_SECRET=$(openssl rand -hex 24)' },
    { id: 'review-user', t: 'Test-Konto für Apples Prüfung anlegen', who: 'du', must: true, d: 'In Supabase einen Nutzer mit Passwort anlegen; die App hat dafür „Mit Passwort anmelden“. Dazu 3–5 echte Testprofile in der Nähe, damit der Stapel nicht leer ist.' },
  ]},
  { id: 'money', title: 'Bezahlsystem funke+', items: [
    { id: 'iap-products', t: 'Abos und Boosts in beiden Stores anlegen', who: 'du', must: true, d: 'Produkt-IDs: funke_plus_1m, funke_plus_6m, funke_plus_12m (Auto-Abos) und funke_boost_1, funke_boost_5. Preisvorschlag: 7,99 / 29,99 / 44,99 € und 2,99 / 9,99 €.' },
    { id: 'sbp', t: 'Apple Small Business Program beantragen', who: 'du', d: 'Apple nimmt dann 15 % statt 30 % Gebühr. Google nimmt bei Abos ohnehin 15 %.' },
    { id: 'paid-apps', t: 'Bankkonto und Steuerdaten hinterlegen', who: 'du', must: true, d: 'App Store Connect → Verträge (Paid Apps Agreement) und Google Play → Zahlungsprofil. Ohne das werden keine Käufe angezeigt.' },
    { id: 'revenuecat', t: 'RevenueCat verbinden', who: 'du', must: true, d: 'Kostenlos bis 2.500 $ Monatsumsatz. Entitlement „plus“, Offering „default“ mit allen fünf Produkten, öffentliche API-Keys in .env.' },
    { id: 'rc-webhook', t: 'Kauf-Webhook deployen', who: 'du', must: true, d: 'Überträgt Käufe in die Datenbank. In RevenueCat unter Integrations → Webhooks die Function-URL und den Bearer-Secret eintragen.', cmd: 'supabase functions deploy revenuecat --no-verify-jwt && supabase secrets set REVENUECAT_WEBHOOK_SECRET=$(openssl rand -hex 24)' },
    { id: 'sandbox', t: 'Käufe mit Testkonten prüfen', who: 'du', must: true, d: 'Apple-Sandbox-Konto bzw. Google-Lizenztester: Abo kaufen, kündigen, wiederherstellen, Boost kaufen.' },
  ]},
  { id: 'legal', title: 'Rechtliches', items: [
    { id: 'imprint', t: 'Firmenname, Adresse und Support-Mail eintragen', who: 'du', must: true, d: 'Alles an einer Stelle: src/constants/app.ts' },
    { id: 'lawyer', t: 'AGB und Datenschutz anwaltlich prüfen lassen', who: 'du', must: true, d: 'Die Texte in der App sind Vorlagen. Sexuelle Orientierung ist ein besonders geschütztes Datum nach Art. 9 DSGVO.' },
    { id: 'urls', t: 'AGB und Datenschutz auch als Webseite veröffentlichen', who: 'du', must: true, d: 'Beide Stores verlangen eine öffentlich erreichbare URL zur Datenschutzerklärung.' },
    { id: 'dpa', t: 'Auftragsverarbeitungsverträge abschließen', who: 'du', d: 'Mit Supabase und deinem Mail-Anbieter. Beide bieten das im Dashboard an.' },
  ]},
  { id: 'brand', title: 'Marke & Store-Assets', items: [
    { id: 'bundle', t: 'Bundle-ID auf deine Domain ändern', who: 'du', must: true, d: 'In app.json: ios.bundleIdentifier und android.package. Lässt sich nach dem ersten Upload nicht mehr ändern.' },
    { id: 'icon', t: 'Finales App-Icon gestalten', who: 'du', d: 'Das aktuelle Flammen-Icon ist ein Platzhalter. 1024 × 1024 px, ohne Transparenz.' },
    { id: 'name-check', t: 'Markennamen prüfen', who: 'du', d: '„funke“ beim DPMA/EUIPO und im App Store suchen. Notfalls in app.json umbenennen.' },
    { id: 'shots', t: 'Store-Screenshots prüfen', who: 'du', must: true, d: '7 fertige Bilder im Format 1320 × 2868 liegen in store/screenshots/ios-6.9. Sie stammen aus der Web-Version; nach dem ersten TestFlight-Build gegen Aufnahmen vom echten Gerät tauschen.' },
  ]},
  { id: 'ship', title: 'Bauen & einreichen', items: [
    { id: 'beta', t: 'Testversion auf echten Geräten prüfen', who: 'du', must: true, d: 'Gesten, Kamera, Standort und Push laufen nur auf echten Geräten. Ideal: 10–20 Testpersonen über TestFlight.', cmd: 'npx eas-cli@latest build --profile preview --platform all' },
    { id: 'build', t: 'Produktions-Build erstellen', who: 'du', must: true, cmd: 'npx eas-cli@latest build --profile production --platform all' },
    { id: 'privacy-labels', t: 'Datenschutzangaben ausfüllen', who: 'du', must: true, d: 'App Store Connect → App Privacy und Google Play → Data Safety. Antworten stehen in STORE.md.' },
    { id: 'submit', t: 'Bei Apple und Google einreichen', who: 'du', must: true, d: 'Altersfreigabe 17+ wählen. Prüfnotizen aus STORE.md einfügen.', cmd: 'npx eas-cli@latest submit --platform ios && npx eas-cli@latest submit --platform android' },
  ]},
  { id: 'ops', title: 'Nach dem Launch', items: [

    { id: 'verify', t: 'Ablauf für Profil-Verifizierung festlegen', who: 'du', d: 'Aktuell per SQL mit moderate(..., \'verify\'). Später lässt sich ein Selfie-Abgleich anbinden.' },
    { id: 'revenue', t: 'Umsätze wöchentlich ansehen', who: 'du', d: 'RevenueCat-Dashboard oder in Supabase die Ansicht revenue_daily. Bei 29,99 € für 6 Monate kommen nach Steuer und Store-Gebühr ca. 21,42 € bei dir an.' },
    { id: 'seed', t: 'Startregion mit echten Nutzer:innen füllen', who: 'du', d: 'Eine Dating-App lebt von Dichte. Mit einer Stadt starten, z. B. Berlin.' },
  ]},
];

const DONE = ['Swipen mit Gesten, Undo, Super-Like', 'Like auf Foto oder Antwort mit Kommentar', 'Wer zuerst schreibt, wählt jede:r selbst', 'Matches laufen nach 48 h ab, 1× verlängerbar', 'Likes kostenlos sehen', 'Match-Score mit Begründung', 'Daily Spark', 'Echtzeit-Chat mit Icebreakern', 'Login per E-Mail-Code', 'Onboarding mit 18+-Prüfung', 'Melden, Blockieren, Sicherheits-Center', 'Konto in der App löschen', 'Datenbank mit Zugriffsregeln (getestet)', 'Push-Benachrichtigungen', 'Dark Mode, iOS, Android, Web', 'Demo-Modus ohne Server', 'Spam-Schutz und Tageslimits', 'Auto-Ausblenden nach 3 Meldungen', 'Passwort-Login für App Review', 'Kamera & Foto-Komprimierung', '19 App-Tests + 19 Datenbank-Tests', 'GitHub-Actions-CI', '7 Store-Screenshots', 'Premium-Abo funke+ mit Paywall', 'Boosts einzeln kaufbar', 'Gratis-Limits serverseitig gesichert', 'Login mit Apple, Google, SMS, E-Mail', '35 Datenbank-Tests, 27 App-Tests'];

const TEXTS = [
  { label: 'App-Name', text: 'funke – Dating & echte Matches' },
  { label: 'Untertitel (max. 30 Zeichen)', text: 'Weniger swipen, mehr verbinden' },
  { label: 'Werbetext', text: 'Sieh kostenlos, wer dich mag – und erfahre, warum ihr zusammenpasst.' },
  { label: 'Keywords (max. 100 Zeichen)', text: 'dating,partnersuche,singles,kennenlernen,flirt,beziehung,match,chat,liebe,date' },
  { label: 'Beschreibung', text: 'funke ist die Dating-App für Menschen, die mehr wollen als endloses Swipen.\n\n• Transparenter Match-Score: Du siehst, was ihr gemeinsam habt – Interessen, Absichten, Nähe.\n• Like, was dich wirklich anspricht: ein bestimmtes Foto oder eine Antwort, gern mit Kommentar.\n• Du entscheidest, wer zuerst schreibt – du, dein Match oder egal.\n• Kostenlos sehen, wer dich geliked hat.\n• Daily Spark: Jeden Tag dein kompatibelstes Profil zuerst.\n• Persönliche Icebreaker, damit das erste „Hey“ nie wieder schwer ist.\n• Klare Absichten: von „Feste Beziehung“ bis „Neue Freundschaften“ – als Filter nutzbar.\n• Sicherheit zuerst: verifizierte Profile, Melden & Blockieren in jedem Chat, Sicherheits-Center.\n• Kein Werbe-Tracking. Deine Daten gehören dir.' },
  { label: 'Notizen für Apples Prüfung', text: 'Login per E-Mail-Code. Test-Konto: [E-Mail] / Code: [Code].\nNutzerinhalte (Guideline 1.2): Nutzungsbedingungen mit Null-Toleranz-Regel werden vor der Registrierung akzeptiert. Melden und Blockieren gibt es in jedem Profil und Chat oben rechts. Meldungen werden innerhalb von 24 Stunden geprüft.\nKonto löschen (5.1.1(v)): Profil → Einstellungen → Konto löschen.\nMindestalter 18: Das Geburtsdatum wird im Onboarding geprüft, die Datenbank lehnt Minderjährige ab.' },
];

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const all = PHASES.flatMap((p) => p.items);
let artifact = null;
let canSave = false;
let known = false;
let saving = false;
let pending = null;

function render() {
  const n = all.filter((i) => state.done[i.id]).length;
  const pct = Math.round((n / all.length) * 100);
  const app = document.getElementById('app');
  app.innerHTML = `
    <header>
      <span class="eyebrow">Dating-App · Expo SDK 58 · Supabase</span>
      <h1>Von fertigem Code zum <em>App Store</em></h1>
      <p class="lede">Die App ist programmiert und getestet. Was noch fehlt, braucht deine Konten, deine Firma oder deine Entscheidung. Hake ab, was erledigt ist; der Stand bleibt gespeichert.</p>
      <div class="meter">
        <div class="meter-top"><strong>${n} von ${all.length}</strong><span class="muted">${pct} % bis zum Launch</span></div>
        <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${all.length}" aria-valuenow="${n}"><i style="width:${pct}%"></i></div>
        <div class="save" id="save" aria-live="polite">${known && !canSave ? 'Nur ansehen: Häkchen werden in dieser Ansicht nicht gespeichert.' : ''}</div>
      </div>
    </header>
    <section aria-label="Screenshots">
      <div class="strip">${imgs.map((im) => `<figure><img src="${im.src}" alt="${esc(im.cap)}" loading="lazy"><figcaption>${esc(im.cap)}</figcaption></figure>`).join('')}</div>
    </section>
    <section>
      <h2>Was noch zu tun ist</h2>
      <p class="note">Markiert mit <span class="who must">Pflicht</span>: ohne diese Schritte lehnt Apple oder Google die App ab, oder sie funktioniert nicht.</p>
      ${PHASES.map((p) => {
        const d = p.items.filter((i) => state.done[i.id]).length;
        return `<div class="phase"><div class="phase-head"><h3>${esc(p.title)}</h3><span>${d}/${p.items.length}</span></div>
        ${p.items.map((i) => `<div class="item${state.done[i.id] ? ' done' : ''}">
          <input type="checkbox" id="c-${i.id}" data-id="${i.id}" ${state.done[i.id] ? 'checked' : ''}>
          <div class="item-body">
            <label for="c-${i.id}">${esc(i.t)}${i.must ? '<span class="who must">Pflicht</span>' : ''}</label>
            ${i.d ? `<p class="detail">${esc(i.d)}</p>` : ''}
            ${i.cmd ? `<div class="cmd"><code>${esc(i.cmd)}</code><button class="copy" data-copy="${esc(i.cmd)}">Kopieren</button></div>` : ''}
          </div></div>`).join('')}</div>`;
      }).join('')}
    </section>
    <section>
      <h2>Store-Texte zum Einfügen</h2>
      <div class="texts">${TEXTS.map((t, k) => `<div class="text-card"><div class="row"><span class="eyebrow">${esc(t.label)}</span><button class="copy-text" data-text="${k}">Kopieren</button></div><pre>${esc(t.text)}</pre></div>`).join('')}</div>
    </section>
    <section>
      <h2>Schon fertig in der App</h2>
      <ul class="done-list">${DONE.map((d) => `<li>${esc(d)}</li>`).join('')}</ul>
      <p class="muted">Code: <code style="font-family:var(--mono);font-size:14px">/home/user/spark</code> · Anleitung in README.md, Store-Details in STORE.md</p>
    </section>`;
}

function setSave(msg) { const el = document.getElementById('save'); if (el) el.textContent = msg; }

function documentFromState() {
  const s = document.getElementById('s').textContent;
  const main = document.getElementById('main').textContent;
  const imgsJson = document.getElementById('imgs').textContent;
  const json = JSON.stringify({ done: state.done }).replace(/</g, '\\u003c');
  const fonts = document.querySelector('link[rel="stylesheet"]').getAttribute('href');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + RESET + '</style></head><body>'
    + '<title>funke Launch-Cockpit</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<link rel="stylesheet" href="' + fonts + '">\n'
    + '<style id="s">' + s + '</style>\n<div id="app" class="wrap"></div>\n'
    + '<script type="application/json" id="state">' + json + '<\/script>\n'
    + '<script type="application/json" id="imgs">' + imgsJson + '<\/script>\n'
    + '<script id="main">' + main + '<\/script>\n</body></html>';
}

async function save() {
  if (!artifact || !canSave) return;
  if (saving) { pending = true; return; }
  saving = true;
  setSave('Speichert …');
  try {
    await artifact.publish(documentFromState());
    setSave('Gespeichert');
  } catch (e) {
    const code = e && e.code;
    if (code === 'not_granted' || code === 'not_writer') { canSave = false; setSave('Nur ansehen: du hast keine Bearbeitungsrechte für diese Seite.'); }
    else if (code === 'conflict') setSave('Jemand anderes hat gleichzeitig gespeichert. Die Seite lädt den neuesten Stand.');
    else setSave('Speichern fehlgeschlagen. Prüfe deine Verbindung und hake erneut ab.');
  } finally {
    saving = false;
    if (pending) { pending = null; save(); }
  }
}

let timer = null;
document.addEventListener('change', (e) => {
  const el = e.target;
  if (!el.matches || !el.matches('input[data-id]')) return;
  if (el.checked) state.done[el.dataset.id] = true; else delete state.done[el.dataset.id];
  render();
  const again = document.getElementById('c-' + el.dataset.id);
  if (again) again.focus();
  clearTimeout(timer);
  timer = setTimeout(save, 900);
});

async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); btn.textContent = 'Kopiert'; }
  catch (_) {
    const pre = btn.closest('.cmd, .text-card').querySelector('code, pre');
    const r = document.createRange(); r.selectNodeContents(pre);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    btn.textContent = 'Markiert – jetzt kopieren';
  }
  setTimeout(() => { btn.textContent = 'Kopieren'; }, 1800);
}
document.addEventListener('click', (e) => {
  const b = e.target.closest && e.target.closest('button');
  if (!b) return;
  if (b.dataset.copy != null) copy(b.dataset.copy, b);
  if (b.dataset.text != null) copy(TEXTS[Number(b.dataset.text)].text, b);
});

canSave = false;
render();
(async () => {
  try { artifact = window.claude && window.claude.use ? await window.claude.use('artifact') : null; } catch (_) { artifact = null; }
  canSave = !!artifact;
  known = true;
  render();
})();
})();
</script>
